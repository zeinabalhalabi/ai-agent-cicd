name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/zeinabalhalabi/ai-agent-cicd:latest   

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Project check
        run: python manage.py check   # see note below if not Django

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE }} .

      - name: Push Docker image
        run: docker push ${{ env.IMAGE }}

  deploy:
    needs: test
    runs-on: [self-hosted, portfolio-deploy]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check Docker
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: docker info

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          docker pull --platform linux/amd64 ${{ env.IMAGE }}
          exit $LASTEXITCODE

      - name: Deploy
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $existing = docker ps -aq --filter "name=^/portfolio-app$"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($existing) {
            docker rm -f portfolio-app
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          docker run -d --platform linux/amd64 --name portfolio-app -p 127.0.0.1:8000:8000 ${{ env.IMAGE }}
          exit $LASTEXITCODE